[project]
name = "multimodal-agent"
version = "0.1.0"
description = "An AI agent that decides how to learn joint representations of multimodal biomedical data, given a user objective"
readme = "README.md"
# Pinned to 3.12 for parity with Projects 1-2 and wheel availability (torch, scanpy, numba).
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- numerical core ---
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    # --- deep learning (MPS on Apple silicon, CUDA elsewhere) ---
    "torch>=2.4",
    "torchvision>=0.19",
    # --- pretrained encoders (open weights only) ---
    "transformers>=4.44",
    "open-clip-torch>=2.26",
    "timm>=1.0",
    "huggingface-hub>=0.24",
    # --- data formats ---
    "anndata>=0.10",
    "scanpy>=1.10",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "h5py>=3.10",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    # --- reporting ---
    "matplotlib>=3.8",
    "umap-learn>=0.5.5",
    "markdown>=3.5",
    "pyyaml>=6.0",
    # --- agent scaffolding ---
    "pydantic>=2.6",
    "claude-agent-sdk>=0.2.176",
]

[project.scripts]
mmagent = "multimodal_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multimodal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# anndata's own pandas-4 deprecation notice; not ours to fix.
filterwarnings = ["ignore:The 'future.infer_string' option is deprecated"]
